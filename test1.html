<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">

<style>

body {
    margin: 0;
    min-height: 100vh;

    background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.9) 2px, transparent 3px),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,0.8) 2px, transparent 3px),
        radial-gradient(circle at 40% 70%, rgba(255,255,255,0.9) 2px, transparent 3px),
        radial-gradient(circle at 90% 80%, rgba(255,255,255,0.8) 2px, transparent 3px),
        linear-gradient(to bottom, #f0fff0, #c8f0c8, #a8dfa8);

    background-size:
        150px 150px,
        200px 200px,
        180px 180px,
        250px 250px,
        100% 100%;
}

h1 {
    color: blue;
    text-align: center;
    font-size: 60px;
    font-family: 'Trebuchet MS', sans-serif;
    text-shadow: 0 0 2px #00e9ff, 0 0 20px #0088ff;
}

h2 {
    color: #ff4d6d;
    text-align: center;
    font-size: 42px;
    font-family: Georgia, serif;
    letter-spacing: 3px;
    text-shadow: 3px 3px 0px #ffd166;
    margin: 40px;
}

button {
    display: block;
    margin: 30px auto;
    padding: 15px 35px;
    font-size: 22px;
    border: none;
    border-radius: 15px;
    background: #7c3aed;
    color: white;
    cursor: pointer;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
}

button:hover {
    transform: scale(1.08);
    box-shadow: 0 0 20px #7c3aed;
}

#task {
    text-align: center;
    font-family: 'Trebuchet MS', sans-serif;
    font-size: 30px;
    color: #333;
    margin-top: 50px;
}

</style>
</head>

<body>

<h1>WELCOME TO TASKDROP</h1>

<h2>🎲 Click for your next adventure! 🎲</h2>

<button onclick="giveTask()">🎯 Give Me a Task</button>

<p id="task"></p>

<script>

let tasks = [
    "write a letter to your future self and read it next on the same day",
    "Go rockclimbing",
    "Put out a foodstall🚶",
    "Learn a new language",
    "Write down 3 goals and try to achieve them within next 2 months✍️",
    "write a weird letter and leave it at someones doorstep",
    "Throw a dart at a map and go to that state/city",
    "Watch the movie Gummo",
    "Try to learn singing for 1 month",
    
];

function giveTask() {

    let random = Math.floor(Math.random() * tasks.length);

    document.getElementById("task").innerHTML = tasks[random];

}

</script>

</body>
</html>
